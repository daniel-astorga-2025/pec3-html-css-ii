<form
  class="card"
  name="contacto-artesanos"
  method="POST"
  data-netlify="true"
  netlify-honeypot="bot-field"
  netlify
>
  <input type="hidden" name="form-name" value="contacto-artesanos" />

  <p class="hidden">
    <label>
      No rellenar:
      <input name="bot-field" />
    </label>
  </p>

  <div class="mb-5">
    <label for="name" class="form-label">Nombre</label>
    <input
      id="name"
      class="form-field"
      type="text"
      name="name"
      required
      autocomplete="name"
    />
  </div>

  <div class="mb-5">
    <label for="email" class="form-label">Correo electrónico</label>
    <input
      id="email"
      class="form-field"
      type="email"
      name="email"
      required
      autocomplete="email"
    />
  </div>

  <div class="mb-5">
    <label for="interest" class="form-label">Motivo de contacto</label>
    <select id="interest" class="form-field" name="interest" required>
      <option value="">Selecciona una opción</option>
      <option value="asistencia">Quiero asistir</option>
      <option value="taller">Quiero participar en un taller</option>
      <option value="colaboracion">Quiero colaborar</option>
      <option value="informacion">Solicitar información</option>
    </select>
  </div>

  <div class="mb-6">
    <label for="message" class="form-label">Mensaje</label>
    <textarea
      id="message"
      class="form-field"
      name="message"
      rows="5"
      required
    ></textarea>
  </div>

  <button class="btn-primary w-full sm:w-auto" type="submit">
    Enviar mensaje
  </button>
</form>
